<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="800" height="450" role="img" aria-label="Storage volumes rising while a regulatory capacity ceiling closes down on them.">
  <title>A growing volume problem</title>

  <style><![CDATA[
    /* ── Bar grow from baseline ──
       opacity 0→1 ensures bars are invisible during their delay even if
       animation-fill-mode:backwards is not honoured by the img sandbox. */
    @keyframes growBar {
      from { transform: scaleY(0); opacity: 0; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    /* ── Breach sections pop up (spring easing) ── */
    @keyframes breachPop {
      0%   { transform: scaleY(0); }
      65%  { transform: scaleY(1.18); }
      100% { transform: scaleY(1); }
    }

    /* ── Capacity ceiling breathes as warning ──
       Delay baked in: 40% hold (≈1.9 s) then pulse.
       No animation-delay so every loop stays identical. */
    @keyframes ceilingBreath {
      0%, 40%  { opacity: 1; }
      70%      { opacity: 0.22; }
      100%     { opacity: 1; }
    }

    /* Bars — staggered growth from baseline */
    .bar {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: growBar 0.52s ease-out both;
    }
    .b1 { animation-delay: 0.15s; }
    .b2 { animation-delay: 0.27s; }
    .b3 { animation-delay: 0.39s; }
    .b4 { animation-delay: 0.51s; }
    .b5 { animation-delay: 0.63s; }
    .b6 { animation-delay: 0.75s; }
    .b7 { animation-delay: 0.87s; }
    .b8 { animation-delay: 0.99s; }

    /* Breach rects — appear after bars are built */
    .breach rect {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: breachPop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .breach rect:nth-child(1) { animation-delay: 1.28s; }
    .breach rect:nth-child(2) { animation-delay: 1.48s; }
    .breach rect:nth-child(3) { animation-delay: 1.68s; }

    /* Ceiling — pulses continuously; delay embedded in keyframe */
    .ceiling {
      animation: ceilingBreath 4.7s ease-in-out infinite;
    }
  ]]></style>

  <!-- Baseline -->
  <line x1="8" y1="152" x2="312" y2="152" stroke="#E2E8EC" stroke-width="1"/>

  <!-- Capacity ceiling -->
  <g class="ceiling">
    <line x1="8" y1="54" x2="312" y2="54" stroke="#D97757" stroke-width="1.25" stroke-dasharray="3 4"/>
    <text class="ceiling-label" x="312" y="46" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#D97757" letter-spacing="1">CAPACITY</text>
  </g>

  <!-- Bars — opacity="0" seeds the invisible state before each animation delay fires -->
  <g>
    <rect class="bar b1" x="20"  y="64" width="20" height="88"  fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b2" x="56"  y="79" width="20" height="73"  fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b3" x="92"  y="56" width="20" height="96"  fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b4" x="128" y="72" width="20" height="80"  fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b5" x="164" y="50" width="20" height="102" fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b6" x="200" y="66" width="20" height="86"  fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b7" x="236" y="44" width="20" height="108" fill="#0E1A2B" rx="1" opacity="0"/>
    <rect class="bar b8" x="272" y="60" width="20" height="92"  fill="#0E1A2B" rx="1" opacity="0"/>
  </g>

  <!-- Breach — bars exceeding capacity -->
  <g class="breach">
    <rect x="92"  y="50" width="20" height="6"  fill="#D97757" rx="1"/>
    <rect x="164" y="44" width="20" height="10" fill="#D97757" rx="1"/>
    <rect x="236" y="38" width="20" height="16" fill="#D97757" rx="1"/>
  </g>

  <!-- Label -->
  <text x="8" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#9AB1BD" letter-spacing="1.5">VOLUMES ↑   ·   CAPACITY ↓</text>
</svg>
